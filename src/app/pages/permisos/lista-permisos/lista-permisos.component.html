<div class="container-fluid ap-page hm-admin" [@fadeInRight]>

  <!-- ================= Encabezado ================= -->
  <section class="ap-hero mb-4">
    <span class="ap-corner tl">A<br>♠</span><span class="ap-corner br">A<br>♠</span>
    <div class="row g-4 align-items-center">
      <div class="col-12 col-xl-7">
        <div class="d-flex flex-wrap align-items-center gap-3">
          <div class="ap-hero-icon"><i class="fas fa-lock"></i></div>
          <div class="min-w-0 flex-grow-1">
            <nav class="ap-crumbs mb-1" aria-label="Ruta">
              <span><i class="fas fa-shield-alt"></i>Administración</span><i class="fas fa-chevron-right sep"></i><span class="now">Permisos</span>
            </nav>
            <h1 class="ap-title mb-1">Apartado de Permisos</h1>
            <p class="ap-sub mb-0">Gestiona los accesos y acciones disponibles dentro del sistema</p>
          </div>
          <!-- Acción principal junto al título -->
          <button type="button" (click)="agregar()" class="ap-btn ap-btn--primary ap-btn--cta">
            <span class="ap-btn-icon"><i class="fas fa-plus"></i></span>
            <span class="ap-btn-text"><span class="ap-btn-label">Nuevo permiso</span><span class="ap-btn-desc">Registrar un permiso</span></span>
          </button>
        </div>
      </div>
      <div class="col-12 col-xl-5">
        <div class="row g-2 g-sm-3">
          <div class="col-4">
            <div class="ap-stat"><span class="ap-stat-val">{{ totalRegistros }}</span><span class="ap-stat-lab">Registrados</span></div>
          </div>
          <div class="col-4">
            <div class="ap-stat ap-stat--green"><span class="ap-stat-val">{{ activosPagina }}</span><span class="ap-stat-lab">Activos en página</span></div>
          </div>
          <div class="col-4">
            <div class="ap-stat ap-stat--gold"><span class="ap-stat-val">{{ paginaActual }}/{{ totalPaginas || 1 }}</span><span class="ap-stat-lab">Página</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= Listado ================= -->
    <div class="ap-grid-wrap mt-4">
                    <dx-data-grid #gridContainer id="gridContainer" [columnHidingEnabled]="true" [showBorders]="'true'"
                        [showColumnLines]="true" [showRowLines]="true" [rowAlternationEnabled]="'true'"
                        [dataSource]="listaPermisos" [keyExpr]="'id'" [width]="'100%'"
                        [remoteOperations]="{ paging: true }" [paging]="{ pageSize: pageSize }" [pager]="{ 
                                showPageSizeSelector: true, 
                                allowedPageSizes: [20], 
                                showInfo: true,
                                infoText: 'Página {0} de {1}', 
                                visible: true 
                            }" (onPageIndexChanged)=" onPageIndexChanged($event)"
                        (onOptionChanged)="onGridOptionChanged($event)">
                        <dxo-search-panel [visible]="true" [width]="200" placeholder="Buscar..."></dxo-search-panel>
                        <dxo-toolbar>
                            <dxi-item name="groupPanel" location="before"></dxi-item>
                            <dxi-item name="exportButton" location="after"
                                [options]="{ text: 'Exportar Grid', icon: 'export' }" [showText]="'always'">
                            </dxi-item>
                            <dxi-item location="after" template="tbContraer"></dxi-item>
                            <dxi-item location="after" template="tbRestablecer"></dxi-item>
                            <dxi-item name="searchPanel" location="after"></dxi-item>
                        </dxo-toolbar>
                        <div *dxTemplate="let t of 'tbContraer'">
                            <button (click)="toggleExpandGroups()" type="button" class="ap-tool-btn ap-tool-btn--blue"
                                ngbTooltip="Abrir o cerrar grupos" placement="top">
                                <span class="ap-tool-icon"><i class="fas fa-expand"></i></span><span class="ap-tool-label">Contraer grid</span>
                            </button>
                        </div>
                        <div *dxTemplate="let t of 'tbRestablecer'">
                            <button (click)="limpiarCampos()" type="button" class="ap-tool-btn ap-tool-btn--gold"
                                ngbTooltip="Quitar agrupación y recargar" placement="top">
                                <span class="ap-tool-icon"><i class="fas fa-sync-alt"></i></span><span class="ap-tool-label">Restablecer</span>
                            </button>
                        </div>
                        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[20]" [showInfo]="true"></dxo-pager>
                        <dxo-group-panel [emptyPanelText]="mensajeAgrupar" [visible]="true"></dxo-group-panel>
                        <dxo-filter-row [visible]="showFilterRow"></dxo-filter-row>
                        <dxo-header-filter [visible]="showHeaderFilter"></dxo-header-filter>
                        <dxo-grouping #expand [autoExpandAll]="autoExpandAllGroups"></dxo-grouping>
                        <dxi-column caption="Acciones" cellTemplate="acciones" alignment="center" [width]="150"></dxi-column>
                        <dxi-column dataField="id" caption="Id" alignment="center" dataType="string" [allowSearch]="true"></dxi-column>
                        <dxi-column dataField="nombre" caption="Nombre" alignment="center" dataType="string" [allowSearch]="true"></dxi-column>
                        <dxi-column dataField="descripcion" caption="Descripción" alignment="center" dataType="string" [allowSearch]="true"></dxi-column>
                        <dxi-column dataField="idModulo2.nombre" caption="Módulo" alignment="center" dataType="string" [allowSearch]="true">
                            <dxo-header-filter [allowSearch]="true"></dxo-header-filter>
                        </dxi-column>
                        <dxi-column dataField="estatus" caption="Estatus" alignment="center" cellTemplate="est"
                            dataType="string">
                            <div *dxTemplate="let f of 'est'">
                                <span *ngIf="f.data.estatus === 1" class="estatus estatus-activo">
                                    Activo
                                </span>
                                <span *ngIf="f.data.estatus !== 1" class="estatus estatus-inactivo">
                                    Inactivo
                                </span>
                            </div>
                        </dxi-column>
                        <div *dxTemplate="let row of 'acciones'" class="d-flex gap-3 justify-content-center">
                            <div>
                                <button valueExpr="id" id="actualizarButton" class="btnAcciones"
                                    (click)="actualizarPermiso(row.data.id)"
                                    ngbTooltip="Editar permiso" placement="top">
                                    <i class="fa fa-edit"></i>
                                </button>
                            </div>
                            <div>
                                <button *ngIf="row.data.estatus === 0" id="pinButton" class="btnAcciones"
                                    (click)="activar(row.data)"
                                    [disabled]="procesandoEstatusPermisoId === row.data.id"
                                    ngbTooltip="Activar permiso" placement="top">
                                    <i class="fa fa-spinner fa-spin" *ngIf="procesandoEstatusPermisoId === row.data.id"></i>
                                    <i class="fa fa-arrow-up" *ngIf="procesandoEstatusPermisoId !== row.data.id"></i>
                                </button>
                                <button *ngIf="row.data.estatus === 1" id="deleteButton" class="btnAcciones"
                                    (click)="desactivar(row.data)"
                                    [disabled]="procesandoEstatusPermisoId === row.data.id"
                                    ngbTooltip="Desactivar permiso" placement="top">
                                    <i class="fa fa-spinner fa-spin" *ngIf="procesandoEstatusPermisoId === row.data.id"></i>
                                    <i class="fa fa-arrow-down" *ngIf="procesandoEstatusPermisoId !== row.data.id"></i>
                                </button>
                            </div>
                        </div>
                        <dxo-export [enabled]="false" [allowExportSelectedData]="false"
                            [texts]="{ exportAll: 'Exportar todos los datos a Excel' }">
                        </dxo-export>
                    </dx-data-grid>
    </div>
  </section>
</div>
