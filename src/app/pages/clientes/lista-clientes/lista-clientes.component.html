<div class="container-fluid ap-page hm-admin" [@fadeInRight]>

  <!-- ================= Encabezado ================= -->
  <section class="ap-hero mb-4">
    <span class="ap-corner tl">A<br>♠</span><span class="ap-corner br">A<br>♠</span>
    <div class="row g-4 align-items-center">
      <div class="col-12 col-xl-7">
        <div class="d-flex flex-wrap align-items-center gap-3">
          <div class="ap-hero-icon"><i class="fas fa-users"></i></div>
          <div class="min-w-0 flex-grow-1">
            <nav class="ap-crumbs mb-1" aria-label="Ruta">
              <span><i class="fas fa-shield-alt"></i>Administración</span><i class="fas fa-chevron-right sep"></i><span class="now">Clientes</span>
            </nav>
            <h1 class="ap-title mb-1">Directorio de Clientes</h1>
            <p class="ap-sub mb-0">Visualiza y administra la cartera de clientes</p>
          </div>
          <!-- Acción principal junto al título -->
          <button type="button" (click)="agregar()" class="ap-btn ap-btn--primary ap-btn--cta">
            <span class="ap-btn-icon"><i class="fas fa-plus"></i></span>
            <span class="ap-btn-text"><span class="ap-btn-label">Nuevo Cliente</span><span class="ap-btn-desc">Registrar un cliente</span></span>
          </button>
        </div>
      </div>
      <div class="col-12 col-xl-5">
        <div class="row g-2 g-sm-3">
          <div class="col-4">
            <app-stat-card label="Registrados" icon="fas fa-database" tone="red" [value]="totalRegistros"></app-stat-card>
          </div>
          <div class="col-4">
            <app-stat-card label="Activos en Página" icon="fas fa-check-circle" tone="green" [value]="activosPagina"></app-stat-card>
          </div>
          <div class="col-4">
            <app-stat-card label="Página" icon="fas fa-layer-group" tone="gold" [value]="paginaActual" [total]="totalPaginas"></app-stat-card>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= Listado ================= -->
    <div class="ap-grid-wrap mt-4">
                    <dx-data-grid (onCellPrepared)="celdaVacia($event)" #gridContainer id="gridContainer" [columnHidingEnabled]="true" [showBorders]="'true'"
                        [showColumnLines]="true" [showRowLines]="true" [rowAlternationEnabled]="'true'"
                        [dataSource]="listaClientes" [keyExpr]="'id'" [width]="'100%'"
                        [remoteOperations]="{ paging: true, filtering: true }" [paging]="{ pageSize: pageSize }" [pager]="{ 
                                showPageSizeSelector: true, 
                                allowedPageSizes: [20], 
                                showInfo: true,
                                infoText: 'Página {0} de {1}', 
                                visible: true 
                            }" (onPageIndexChanged)=" onPageIndexChanged($event)"
                        (onOptionChanged)="onGridOptionChanged($event)">
                        <dxo-search-panel [visible]="true" [width]="200" placeholder="Buscar..."></dxo-search-panel>
                        <dxo-group-panel [emptyPanelText]="mensajeAgrupar" [visible]="true"></dxo-group-panel>
                        <dxo-filter-row [visible]="showFilterRow"></dxo-filter-row>
                        <dxo-load-panel [enabled]="false"></dxo-load-panel>
                        <dxo-header-filter [visible]="showHeaderFilter"></dxo-header-filter>
                        <dxo-grouping [autoExpandAll]="true"></dxo-grouping>
                        <!-- Barra del grid: agrupación, botones propios y buscador -->
                        <dxo-toolbar>
                            <dxi-item name="groupPanel" location="before"></dxi-item>
                            <dxi-item location="after" template="tbContraer"></dxi-item>
                            <dxi-item location="after" template="tbRestablecer"></dxi-item>
                            <dxi-item name="searchPanel" location="after"></dxi-item>
                        </dxo-toolbar>
                        <div *dxTemplate="let t of 'tbContraer'">
                            <button (click)="toggleExpandGroups()" type="button" class="ap-tool-btn ap-tool-btn--blue"
                                ngbTooltip="Abrir o cerrar grupos" placement="top">
                                <span class="ap-tool-icon"><i class="fas fa-expand"></i></span><span class="ap-tool-label">Contraer Grid</span>
                            </button>
                        </div>
                        <div *dxTemplate="let t of 'tbRestablecer'">
                            <button (click)="limpiarCampos()" type="button" class="ap-tool-btn ap-tool-btn--gold"
                                ngbTooltip="Quitar agrupación y recargar" placement="top">
                                <span class="ap-tool-icon"><i class="fas fa-sync-alt"></i></span><span class="ap-tool-label">Restablecer</span>
                            </button>
                        </div>
                        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[20]"
                            [showInfo]="true"></dxo-pager>
                        <!-- <dxi-column dataField="Logotipo" caption="Logotipo" alignment="center" cellTemplate="cellTemplate">
                                <ng-template *dxTemplate="let d of 'cellTemplate'">
                                    <img [src]="d.data.Logotipo" alt="Logo" width="50">
                                </ng-template>
                            </dxi-column> -->
                        <dxi-column caption="Acciones" cellTemplate="Acciones" alignment="center" [width]="150"></dxi-column>
                        <dxi-column dataField="tieneLogo" caption="Logotipo" cellTemplate="logoCliente" alignment="center" [width]="140" [allowSorting]="false">
                            <dxo-lookup [dataSource]="['Con Logotipo', 'Sin Logotipo']"></dxo-lookup>
                        </dxi-column>
                        <div *dxTemplate="let f of 'logoCliente'" class="d-flex justify-content-center py-1">
                            <app-media-avatar [size]="92" [src]="f?.data?.logotipo" [nombre]="f?.data?.NombreCompleto" [tipoPersona]="f?.data?.tipoPersona"></app-media-avatar>
                        </div>
                        <dxi-column dataField="estadoDocumentos" caption="Documentos" cellTemplate="documentos" alignment="center" [width]="340" [allowSorting]="false">
                            <dxo-lookup [dataSource]="['Completo', 'Parcial', 'Sin Documentos']"></dxo-lookup>
                        </dxi-column>
                        <div *dxTemplate="let f of 'documentos'" class="py-1">
                            <app-documentos-celda [docs]="documentosDe(f?.data)" (ver)="previsualizar($event.url, $event.titulo, f?.data)"></app-documentos-celda>
                        </div>
                        <dxi-column dataField="NombreCompleto" caption="Nombre" alignment="center"
                            dataType="string"></dxi-column>
                        <dxi-column dataField="telefono" caption="Teléfono" alignment="center"
                            dataType="string"></dxi-column>
                        <dxi-column dataField="rfc" caption="RFC" alignment="center" dataType="string"></dxi-column>
                        <dxi-column dataField="correo" caption="Correo" alignment="center"
                            dataType="string"></dxi-column>
                        <dxi-column dataField="tipoPersona" caption="Tipo Persona" alignment="center"
                            dataType="string"></dxi-column>
                        <dxi-column dataField="estatus" caption="Estatus" alignment="center" dataType="number"
                            cellTemplate="est">
                            <dxo-lookup [dataSource]="lookupEstatus" valueExpr="valor" displayExpr="texto"></dxo-lookup>
                            <div *dxTemplate="let f of 'est'">
                                <span *ngIf="f.data.estatus === 1" class="estatus estatus-activo">
                                    Activo
                                </span>
                                <span *ngIf="f.data.estatus !== 1" class="estatus estatus-inactivo">
                                    Inactivo
                                </span>
                            </div>
                        </dxi-column>
                        <!-- <dxi-column dataField="nombreEncargado" caption="Nombre Encargado"
                            alignment="center"></dxi-column>
                        <dxi-column dataField="telefonoEncargado" caption="Teléfono Encargado"
                            alignment="center"></dxi-column>
                        <dxi-column dataField="correoEncargado" caption="Email Encargado"
                            alignment="center"></dxi-column>
                        <dxi-column dataField="direccionCompleta" caption="Dirección"></dxi-column> -->
                        <dxo-export [enabled]="false" [allowExportSelectedData]="true"
                            [texts]="{ exportAll: 'Exportar todos los datos a Excel', exportSelectedRows: 'Exportar filas seleccionadas a Excel' }">
                        </dxo-export>
                        <div *dxTemplate="let row of 'Acciones'" class="d-flex gap-3 justify-content-center">
                            <div>
                                <button valueExpr="id" id="actualizarButton" class="btnAcciones"
                                    (click)="actualizarCliente(row.data.id)"
                                    ngbTooltip="Editar cliente" placement="top">
                                    <i class="fa fa-edit"></i>
                                </button>
                            </div>
                            <div>
                                <button *ngIf="row.data.estatus === 0" id="pinButton" class="btnAcciones"
                                    (click)="activar(row.data)"
                                    [disabled]="procesandoEstatusClienteId === row.data.id"
                                    ngbTooltip="Activar cliente" placement="top">
                                    <i class="fa fa-spinner fa-spin" *ngIf="procesandoEstatusClienteId === row.data.id"></i>
                                    <i class="fa fa-arrow-up" *ngIf="procesandoEstatusClienteId !== row.data.id"></i>
                                </button>
                                <button *ngIf="row.data.estatus === 1" id="deleteButton" class="btnAcciones"
                                    (click)="desactivar(row.data)"
                                    [disabled]="procesandoEstatusClienteId === row.data.id"
                                    ngbTooltip="Desactivar cliente" placement="top">
                                    <i class="fa fa-spinner fa-spin" *ngIf="procesandoEstatusClienteId === row.data.id"></i>
                                    <i class="fa fa-arrow-down" *ngIf="procesandoEstatusClienteId !== row.data.id"></i>
                                </button>
                            </div>
                        </div>
                    </dx-data-grid>
    </div>
  </section>
</div>

<div class="dm-fondo" *ngIf="previewModalOpen" (click)="closePreview()">
  <div class="dm" role="dialog" aria-modal="true" [attr.aria-label]="previewTitle" (click)="$event.stopPropagation()">
    <header class="dm-head">
      <span class="dm-ico"><i class="fas" [ngClass]="previewType === 'image' ? 'fa-image' : 'fa-file-pdf'"></i></span>
      <div class="dm-textos">
        <h3 class="dm-titulo">{{ previewTitle }}</h3>
        <span class="dm-nombre">{{ nombreArchivoPreview }}</span>
      </div>
      <button type="button" class="dm-cerrar" (click)="closePreview()" aria-label="Cerrar"><i class="fas fa-times"></i></button>
    </header>
    <div class="dm-cuerpo">
      <img *ngIf="previewType === 'image' && previewUrl" class="dm-img" [src]="previewUrl" [alt]="previewTitle" />
      <iframe *ngIf="previewType === 'pdf' && previewSafeUrl" class="dm-pdf" [src]="previewSafeUrl" [title]="previewTitle"></iframe>
      <div *ngIf="(previewType !== 'image' && previewType !== 'pdf') || !previewUrl" class="dm-vacio">
        <i class="fas fa-file"></i>
        <span>Este archivo no se puede previsualizar aquí.</span>
      </div>
    </div>
    <footer class="dm-pie">
      <a *ngIf="previewUrl" class="dm-abrir" [href]="previewUrl" target="_blank" rel="noopener"><i class="fas fa-external-link-alt"></i>Abrir en otra pestaña</a>
      <button type="button" class="dm-listo" (click)="closePreview()">Cerrar</button>
    </footer>
  </div>
</div>

<app-cargando [visible]="loading" texto="Cargando Clientes"></app-cargando>
