      <div class="dropdown d-inline-block" ngbDropdown>
        <button type="button" class="btn header-item tb-user" ngbDropdownToggle id="page-header-user-dropdown">
          <span class="tb-avatar">
            <img class="rounded-circle header-profile-user" [src]="'https://transmovi.s3.us-east-2.amazonaws.com/imagenes/user_default.png'" (error)="onAvatarError($event)"
              alt="Header Avatar">
            <span class="tb-avatar-dot"></span>
          </span>
          <span class="d-none d-xl-inline-flex topbar-user-meta">
            <span class="topbar-user-name">{{ showNombre }}</span>
            <span class="topbar-user-role"><i class="fas fa-crown"></i>{{ showRol }}</span>
          </span>
          <i class="uil-angle-down d-none d-xl-inline-block tb-caret"></i>
        </button>
        <div class="dropdown-menu dropdown-menu-end tb-menu" ngbDropdownMenu>
          <div class="tb-menu-head">
            <span class="tb-menu-name">{{ showNombre }}</span>
            <span class="tb-menu-role">{{ showRol }}</span>
          </div>
          <a class="dropdown-item tb-item" href="javascript: void(0);" (click)="perfilUsuario()">
            <span class="tb-item-icon"><i class="uil uil-user-circle"></i></span>
            <span>{{ 'Perfil Usuario'}}</span>
          </a>
          <div class="dropdown-item tb-item tb-item--out" (click)="logout($event)">
            <span class="tb-item-icon"><i class="uil uil-sign-out-alt"></i></span>
            <span>{{ 'HEADER.LOGIN.LOGOUT' | translate }}</span>
          </div>
        </div>
      </div>
