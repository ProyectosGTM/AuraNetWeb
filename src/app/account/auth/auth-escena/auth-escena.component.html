<div class="auth-escena">
  <div class="casino-login">
    <div class="bg-layer" aria-hidden="true">
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>
      <span class="orb orb-3"></span>
      <span class="grid-floor"></span>
      <span class="suit s-1">♠</span>
      <span class="suit s-2">♥</span>
      <span class="suit s-3">♦</span>
      <span class="suit s-4">♣</span>
      <span class="suit s-5">♥</span>
      <span class="suit s-6">♠</span>
      <span class="chip c-1"></span>
      <span class="chip c-2"></span>
      <span class="chip c-3"></span>
    </div>

    <div class="container-fluid position-relative">
      <div class="row min-vh-100 align-items-center justify-content-center g-0 py-4 py-lg-0">

        <!-- Presentación -->
        <div class="col-12 showcase d-flex flex-column align-items-center justify-content-center text-center px-3 px-md-5 mb-4 mb-lg-0"
          [ngClass]="amplio ? 'col-lg-5 col-xl-4' : 'col-lg-6 col-xl-7'">
          <img src="assets/images/icono.png" alt="AuraNet" class="brand-logo mb-3" />
          <span class="badge-live mb-3"><i class="fas fa-circle"></i> {{ etiqueta }}</span>
          <h1 class="brand-title mb-2">Aura<span>Net</span></h1>
          <p class="brand-tagline mb-4">Sistema de Gestión de Casinos</p>
          <div class="slot-machine d-none d-sm-flex">
            <div class="reel"><div class="strip strip-1"><span>7</span><span>♦</span><span>★</span><span>♠</span><span>7</span></div></div>
            <div class="reel"><div class="strip strip-2"><span>7</span><span>♥</span><span>★</span><span>♣</span><span>7</span></div></div>
            <div class="reel"><div class="strip strip-3"><span>7</span><span>♠</span><span>★</span><span>♦</span><span>7</span></div></div>
          </div>
        </div>

        <!-- Tarjeta -->
        <div class="col-12 px-3 px-sm-4"
          [ngClass]="amplio ? 'col-lg-7 col-xl-7' : 'col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4'">
          <div class="login-card">
            <div class="marquee" aria-hidden="true"></div>
            <div class="card-inner p-4 p-sm-5">
              <div class="text-center mb-4">
                <div class="card-emblem mx-auto mb-3"><i [class]="icono"></i></div>
                <h2 class="login-title mb-1">{{ titulo }}</h2>
                <p class="login-subtitle mb-0" *ngIf="subtitulo">{{ subtitulo }}</p>
              </div>
              <div class="ae-contenido">
                <ng-content></ng-content>
              </div>
            </div>
          </div>
          <p class="text-center copy mt-3 mb-0">© AuraNet · Juega con responsabilidad</p>
        </div>

      </div>
    </div>
  </div>
</div>
